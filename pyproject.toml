[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scan2ha"
version = "0.1.0"
description = "Turn a phone LiDAR scan into an interactive 3D floorplan dashboard in Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["home-assistant", "lidar", "polycam", "sweet-home-3d", "floorplan"]

dependencies = [
  "ezdxf>=1.4",        # Polycam floor-plan DXF
  "trimesh>=4.0",      # the textured mesh
  "numpy>=1.26",
  "scipy>=1.11",       # cKDTree for registration
  "shapely>=2.0",      # room polygons, voids, pole of inaccessibility
  "pillow>=10.0",      # texture rectification
  "svgelements>=1.9",  # reading back Inkscape-edited room polygons
  "click>=8.1",
  "pydantic>=2.6",     # model.json IS the pydantic schema
  "pyyaml>=6.0",
  "rich>=13.0",        # the review tables the human validates against
]

[project.optional-dependencies]
deploy = ["paramiko>=3.4"]           # scp renders to HA's /config/www
ha = ["websockets>=12.0"]            # HA registry over the WebSocket API
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "types-PyYAML", "build>=1.2"]

[project.scripts]
scan2ha = "scan2ha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scan2ha"]
# The .java sources are compiled on first use against the user's own Sweet
# Home 3D install, so they must ship in the wheel like any other data file.
artifacts = ["src/scan2ha/java/*.java"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# The defaults (E, F) plus the rules that catch the mistakes this codebase has
# actually made: unused imports and stale names (F401/F841 come with F), import
# order, and bare excepts.
select = ["E", "F", "I", "B", "UP", "C4"]

[tool.mypy]
# Deliberately not pinned to requires-python's 3.11 floor: numpy's bundled stubs
# use 3.12 syntax, and checking against the interpreter actually running is what
# matches what the tests run on. ruff still enforces 3.11-compatible syntax.
files = ["src/scan2ha"]
# The numeric stack ships no stubs worth the noise; everything of ours is
# checked, and the boundary to trimesh/ezdxf/scipy is explicitly untyped.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  # Needs a real Sweet Home 3D and JDK. Skipped elsewhere, but these are the
  # only tests that exercise code Sweet Home 3D's own classes have to run.
  "java: requires a local Sweet Home 3D install and a JDK",
]
