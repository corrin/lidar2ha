# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!uv.lock"

  path_instructions:
    - path: "src/lidar2ha/**/*.py"
      instructions: |
        Read CLAUDE.md first. Most of what looks unusual here is deliberate.

        Nothing may be dropped in silence. Failures here are invisible at
        runtime: a light in the wrong room still renders, a group and its
        members just make a room brighter. For any new filter, threshold or
        skip, ask what the user sees when it is wrong. If the answer is
        "nothing", say so.

        Plan geometry is centimetres, mesh and registration are metres, and
        names carry the unit (floor_z_m, plan_x_cm). Flag arithmetic that mixes
        frames. Each capture has its own frame; flag coordinates treated as
        interchangeable without a Registration.

        schema.py is the specification for model.json. Flag re-validation of
        what extra="forbid" already guarantees, and dict.get chains on typed
        data. An optional field's None is information, not a default.

        Do not suggest `# type: ignore`. mypy is clean and the boundary to
        trimesh, scipy and ezdxf is annotated Any deliberately.

        Flag a second hand-written derivation of maths that already exists.

        Comments name the failure they prevent, in a line or two. Do not ask
        for comments that restate the code.

    - path: "tests/**/*.py"
      instructions: |
        One property per test; the docstring names the failure caught, not what
        the code does.

        Test data comes from a real house and a real Home Assistant instance.
        Flag invented-looking numbers, and tests that could pass vacuously.

    - path: "src/lidar2ha/java/*.java"
      instructions: |
        Targets Java 8 (--release 8); the render JVM refuses class files above
        version 52. Flag any newer API or syntax.

    - path: ".github/workflows/*.yml"
      instructions: |
        Flag dropping --locked (the lock stops being verified) or --all-extras
        (removes paramiko and websockets, and the tests covering them).
