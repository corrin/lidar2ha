version: 2

# uv.lock does not constrain what this project works with. The floors in
# pyproject.toml are the actual claim; the lock only records the versions the
# suite was last run against, so anyone hitting a problem can see what we had
# and what they have. Dependabot's job is to keep that record moving, because a
# record that stops being updated stops describing anything anyone is running.
#
# The policy is to take a new version as soon as it exists and CI passes.

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

    groups:
      # Routine drift arrives as one reviewable change. Eleven pull requests for
      # eleven patch bumps is how the lock stops being looked at at all.
      routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    # Majors are left ungrouped, one PR each -- not because they are suspect,
    # but because a batch that fails CI is a batch that cannot land. The bump
    # most likely to need work should not hold the others up.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns: ["*"]
