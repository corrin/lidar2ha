name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; the older run's answer is about code nobody
# has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anything back.
permissions:
  contents: read

jobs:
  check:
    strategy:
      # Both legs always report. The interesting failure is one platform passing
      # and the other not, and fail-fast would cancel exactly the run that says so.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # No python-version here: uv reads .python-version, so the interpreter is
      # pinned in the repo rather than duplicated in this file where it would drift.
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # --locked is the point of this job. It fails when uv.lock has fallen behind
      # pyproject.toml, which is the one thing no amount of local care catches:
      # everything keeps working on the machine that already has the packages.
      # --all-extras because paramiko and websockets are extras, and a bare sync
      # would remove them and take test_deploy and test_ha with it.
      - name: Install from the lock, exactly
        run: uv sync --locked --all-extras

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      # -rs lists what was skipped and why. The java tests need Sweet Home 3D and a
      # JDK and skip themselves here, and a silent skip is indistinguishable from a
      # test that quietly stopped covering anything.
      - name: pytest
        run: uv run pytest -q -rs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Build the wheel
        run: uv build

      # The .java sources are compiled at runtime against the user's own Sweet
      # Home 3D install, so they have to be inside the wheel. pyproject.toml says
      # so with hatch's `artifacts`, and until now nothing checked it was true.
      # A wheel missing them installs perfectly and fails at the first `build`,
      # on someone else's machine, with a compiler error about a missing file.
      - name: The wheel must carry the Java sources
        run: |
          python - <<'PY'
          import glob, pathlib, sys, zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[0]
          packaged = {
              pathlib.PurePosixPath(n).name
              for n in zipfile.ZipFile(wheel).namelist()
              if n.endswith(".java")
          }
          on_disk = {p.name for p in pathlib.Path("src/lidar2ha/java").glob("*.java")}
          assert on_disk, "no .java sources found on disk -- this check proves nothing"

          missing = on_disk - packaged
          if missing:
              sys.exit(f"{wheel} is missing Java sources: {sorted(missing)}")
          print(f"{wheel} carries all {len(on_disk)} Java sources")
          PY
