name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # The interpreter comes from .python-version; naming one here would drift.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --all-extras is load-bearing: paramiko and websockets are extras, and a
      # bare sync removes them along with test_deploy and test_ha.
      - name: Install from the lock, exactly
        run: uv sync --locked --all-extras

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -q -rs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build the wheel
        run: uv build

      # The .java sources compile at runtime against the user's own Sweet Home 3D,
      # so a wheel without them installs cleanly and fails at the first `build`.
      - name: The wheel must carry the Java sources
        run: |
          python - <<'PY'
          import glob, pathlib, sys, zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[0]
          packaged = {
              pathlib.PurePosixPath(n).name
              for n in zipfile.ZipFile(wheel).namelist()
              if n.endswith(".java")
          }
          on_disk = {p.name for p in pathlib.Path("src/lidar2ha/java").glob("*.java")}
          assert on_disk, "no .java sources on disk -- this check proves nothing"

          missing = on_disk - packaged
          if missing:
              sys.exit(f"{wheel} is missing Java sources: {sorted(missing)}")
          print(f"{wheel} carries all {len(on_disk)} Java sources")
          PY
